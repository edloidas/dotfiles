# =============================================================================
# Tmux Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------

# Use Ctrl+a as prefix (easier to reach than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix  # Press Ctrl+a twice to send literal Ctrl+a

# Enable mouse support (click panes, resize, scroll)
set -g mouse on

# Start windows and panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Faster command sequences (reduce escape delay)
set -s escape-time 0

# Increase display time for messages and pane indicators
set -g display-time 2000
set -g display-panes-time 3000

# Focus events for vim/neovim autoread
set -g focus-events on

# Aggressive resize - resize to smallest client viewing the window
setw -g aggressive-resize on

# -----------------------------------------------------------------------------
# Terminal and Colors
# -----------------------------------------------------------------------------

# True color (24-bit) support
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:RGB"
set -sa terminal-overrides ",alacritty:RGB"
set -sa terminal-overrides ",*:Tc"

# Undercurl support (for spell checking in neovim)
set -sa terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -sa terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Preserve modified keys (Shift+Enter, Ctrl+Shift+key) instead of collapsing them.
# `always` is required — with `on` tmux only forwards them if the inner app asks.
set -s extended-keys always
set -s extended-keys-format csi-u
set -sa terminal-features ',xterm*:extkeys'

# -----------------------------------------------------------------------------
# Clipboard
# -----------------------------------------------------------------------------

# Lets tmux emit OSC 52 so the terminal owns the copy. On a headless machine
# there is no system clipboard and tmux-yank's pbcopy path has no equivalent,
# so this is what carries a copy-mode `y` over SSH: the LOCAL terminal
# (Ghostty) intercepts the escape sequence and puts the text in the Mac
# clipboard. Harmless on macOS, where pbcopy already works.
set -g set-clipboard on

# -----------------------------------------------------------------------------
# Vi Mode and Copy
# -----------------------------------------------------------------------------

# Use vi keys in copy mode
setw -g mode-keys vi

# Vi-style copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Enter copy mode with Ctrl+a [
bind [ copy-mode

# Paste with Ctrl+a ]
bind ] paste-buffer

# -----------------------------------------------------------------------------
# Pane Navigation and Management
# -----------------------------------------------------------------------------

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"  # Alternative without shift
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with vi keys (Ctrl+a + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate panes with Alt + arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Ctrl+a + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Resize panes with Alt + Shift + arrow (no prefix needed)
bind -n M-S-Left resize-pane -L 2
bind -n M-S-Right resize-pane -R 2
bind -n M-S-Up resize-pane -U 2
bind -n M-S-Down resize-pane -D 2

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Toggle pane zoom
bind z resize-pane -Z

# Kill pane without confirmation
bind x kill-pane

# -----------------------------------------------------------------------------
# Window Navigation
# -----------------------------------------------------------------------------

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Navigate windows with Shift + arrow (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# Navigate windows with Ctrl+a + number
bind 0 select-window -t :0
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# Swap windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Rename window
bind r command-prompt -I "#W" "rename-window '%%'"

# -----------------------------------------------------------------------------
# Session Management
# -----------------------------------------------------------------------------

# Rename session
bind R command-prompt -I "#S" "rename-session '%%'"

# Switch sessions
bind s choose-tree -Zs

# Kill session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# -----------------------------------------------------------------------------
# Utility Bindings
# -----------------------------------------------------------------------------

# Reload config
bind C-r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Toggle synchronize panes (send same input to all panes)
bind S setw synchronize-panes \; display-message "Sync #{?pane_synchronized,ON,OFF}"

# Clear screen and scrollback
bind C-l send-keys 'C-l' \; clear-history

# Open lazygit in a popup (if installed)
bind g display-popup -E -w 90% -h 90% "lazygit"

# Open btop/htop in a popup (if installed)
bind t display-popup -E -w 90% -h 90% "btop || htop || top"

# -----------------------------------------------------------------------------
# Plugins (via TPM)
# -----------------------------------------------------------------------------

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Better copy/paste with system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'

# Save and restore sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Better pane navigation (vim-aware)
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tomorrow Night theme (disabled)
# set -g @plugin 'edouard-lopez/tmux-tomorrow'

# Catppuccin theme
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
# Status bar configuration
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
# Empty on purpose: hides the catppuccin directory module (folder icon + path).
# Keep the option set — tmux-continuum appends its save hook here and needs the
# status-bar refresh to fire; unsetting it would break auto-save.
# set -g status-right "#{E:@catppuccin_status_directory}"
set -g status-right ""

# -----------------------------------------------------------------------------
# Initialize TPM (keep at bottom)
# -----------------------------------------------------------------------------

# Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
